name: smartgate
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: smartgate
      POSTGRES_USER: smartgate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartgate -d smartgate"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres:
